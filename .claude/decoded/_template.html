  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0d0d12;font-family:Inter,system-ui,sans-serif;color:#e8e8ee}

  /* ── Each preview is a self-contained themed slab ── */
  .preview{
    width:100%;height:100%;
    background:var(--bg);
    color:var(--txt);
    padding:28px;
    display:flex;flex-direction:column;gap:14px;
    position:relative;overflow:hidden;
    font-family:var(--b-font);
  }
  .preview::before{
    content:"";position:absolute;inset:0;background:var(--pattern);pointer-events:none;
  }
  .preview > *{position:relative;z-index:1}

  /* Header row: month title + theme name pill */
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .month-title h1{
    font-family:var(--h-font);font-weight:900;
    font-size:54px;line-height:1;letter-spacing:-1px;color:var(--txt);
  }
  .preview[data-theme="6"] .month-title h1{letter-spacing:4px}
  .preview[data-theme="1"] .month-title h1{letter-spacing:2px}
  .month-title p{
    font-family:var(--h-font);font-weight:700;
    font-size:16px;color:var(--txt2);margin-top:4px;
  }
  .preview[data-theme="6"] .month-title p{letter-spacing:5px}

  .theme-pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:22px;
    background:var(--card-bg);border:1.5px solid var(--border);
    font-size:13px;color:var(--txt);font-family:var(--b-font);font-weight:600;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    white-space:nowrap;
  }

  /* Calendar slab */
  .grid{
    background:var(--card-bg);
    border:2px solid var(--border);border-radius:16px;
    overflow:hidden;box-shadow:var(--shadow);
    flex:1;display:flex;flex-direction:column;
  }
  .day-headers{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid var(--border)}
  .day-hdr{
    text-align:center;padding:9px 0;font-size:13px;font-weight:700;
    color:var(--txt);font-family:var(--h-font);
    border-right:1px solid color-mix(in srgb,var(--border) 30%,transparent);
  }
  .day-hdr:last-child{border-right:none}
  .day-hdr.wk{color:var(--wknd)}
  .preview[data-theme="6"] .day-hdr{letter-spacing:2px}

  .cells{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;flex:1}
  .cell{
    border-right:1px solid color-mix(in srgb,var(--border) 30%,transparent);
    border-bottom:1px solid color-mix(in srgb,var(--border) 30%,transparent);
    position:relative;padding:6px;min-height:60px;
  }
  .cell:nth-child(7n){border-right:none}
  .cell.lr{border-bottom:none}
  .cell.om{opacity:.22}
  .cell.we{background:color-mix(in srgb,var(--wknd) 6%,transparent)}
  .cell.we .dnum{color:var(--wknd)}
  .cell.holiday .dnum{color:var(--wknd)}

  .dnum{
    font-size:20px;font-weight:700;font-family:var(--h-font);color:var(--txt);
    line-height:1;
  }
  .preview[data-theme="6"] .dnum{letter-spacing:1px}

  /* Cell decoration mimics the real app */
  .today-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:#2ecc71;border-radius:50%;box-shadow:0 0 6px rgba(46,204,113,.6)}
  .bday{position:absolute;top:4px;right:6px;font-size:13px}
  .holiday-tag{position:absolute;bottom:3px;left:5px;right:5px;font-size:9px;color:var(--wknd);font-weight:700;text-transform:uppercase;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note-tag{position:absolute;bottom:4px;left:5px;right:5px;font-size:10px;color:var(--note);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .diary-tag{position:absolute;bottom:4px;left:5px;right:5px;font-size:10px;color:var(--diary);font-weight:600;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .goal-ring{position:absolute;inset:4px;border:2px solid var(--goal);border-radius:8px;pointer-events:none}

  /* Footer row: swatches + buttons */
  .footer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{
    display:flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:14px;
    background:var(--card-bg);border:1.5px solid var(--border);
    font-size:11px;color:var(--txt2);font-family:var(--b-font);font-weight:600;
  }
  .sw .dot{width:10px;height:10px;border-radius:50%}
  .btn-cta{
    padding:9px 18px;border:none;border-radius:12px;
    background:var(--btn);color:#fff;
    font-size:13px;font-family:var(--b-font);font-weight:700;
    box-shadow:0 4px 15px var(--btn-sh);cursor:pointer;
  }

  /* ── Spec card (technical breakdown, neutral chrome) ── */
  .spec{
    width:100%;height:100%;
    background:#13131a;
    color:#e8e8ee;
    padding:28px;
    display:flex;flex-direction:column;gap:14px;
    font-family:Inter,system-ui,sans-serif;
    overflow:hidden;
  }
  .spec h2{font-size:22px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
  .spec h2 .num{
    width:28px;height:28px;border-radius:8px;background:#23232e;color:#9ca0b0;
    font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;
  }
  .spec .vibe{color:#9ca0b0;font-size:13px;line-height:1.5;margin-bottom:4px}
  .spec dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:12px;align-items:center}
  .spec dt{color:#737686;font-weight:500}
  .spec dd{color:#e8e8ee;font-weight:500;font-feature-settings:"tnum"}
  .spec .row{display:flex;align-items:center;gap:8px}
  .spec .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 9px;border-radius:8px;background:#1d1d27;border:1px solid #2a2a36;
    font-size:11px;font-feature-settings:"tnum";
  }
  .spec .chip .dot{width:10px;height:10px;border-radius:3px;border:1px solid rgba(255,255,255,.15)}
  .spec .palette{display:flex;gap:6px;margin-top:2px}
  .spec .palette .dot{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.1);position:relative}
  .spec .issues{margin-top:auto;padding-top:12px;border-top:1px solid #23232e}
  .spec .issues h3{font-size:11px;color:#737686;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
  .spec .issues ul{list-style:none;display:flex;flex-direction:column;gap:5px}
  .spec .issues li{font-size:12px;color:#c8ccdc;line-height:1.45;padding-left:14px;position:relative}
  .spec .issues li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;background:#ff8159;border-radius:50%}
  .spec .issues li.good::before{background:#5cd6a3}

  /* Overview / summary card */
  .overview{
    width:100%;height:100%;background:#13131a;color:#e8e8ee;padding:36px;
    display:flex;flex-direction:column;gap:18px;font-family:Inter,system-ui,sans-serif;
  }
  .overview h1{font-size:38px;font-weight:700;letter-spacing:-1px}
  .overview .lede{color:#9ca0b0;font-size:15px;line-height:1.55;max-width:680px}
  .overview .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
  .overview .stat{padding:18px;border-radius:14px;background:#1a1a23;border:1px solid #23232e}
  .overview .stat .n{font-size:32px;font-weight:700;letter-spacing:-1px}
  .overview .stat .l{font-size:12px;color:#737686;margin-top:2px;letter-spacing:.3px}
  .overview .grid-themes{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px}
  .overview .tcell{
    aspect-ratio:1;border-radius:14px;padding:10px;
    display:flex;flex-direction:column;justify-content:space-between;
    border:1px solid rgba(255,255,255,.06);
  }
  .overview .tcell .e{font-size:24px}
  .overview .tcell .n{font-size:11px;font-weight:700;line-height:1.2}
  .overview .tcell .palette{display:flex;gap:3px}
  .overview .tcell .palette .d{width:10px;height:10px;border-radius:3px;border:1px solid rgba(255,255,255,.15)}
  .overview .findings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}

// ── Sample month layout (April 2026, today = 26) ────────────────────────────
// 0 = empty/other-month, otherwise day number. 35 cells.
function buildMonth(){
  // April 2026 starts Wed (Apr 1 = Wed). Show 5 weeks of 7 = 35 cells.
  // S M T W T F S
  // Mar 29 30 31 | Apr 1 2 3 4
  // Apr 5 .. 11
  // Apr 12 .. 18
  // Apr 19 .. 25
  // Apr 26 .. May 2
  const cells = [];
  // Row 1: prev-month spillover Sun-Tue, then Apr 1-4
  cells.push({d:29, om:true},{d:30, om:true},{d:31, om:true});
  for(let d=1; d<=4; d++) cells.push({d});
  // Rows 2-4
  for(let d=5; d<=25; d++) cells.push({d});
  // Row 5
  for(let d=26; d<=30; d++) cells.push({d});
  cells.push({d:1, om:true},{d:2, om:true});
  // Decorations (matched to typical app states)
  // Apr 1 = goal, Apr 4 = bday, Apr 10 = note, Apr 14 = diary
  // Apr 17 = holiday (Good Friday-ish demo), Apr 22 = note (Earth Day)
  // Apr 26 = today
  const deco = {
    1:  {goal:true},
    4:  {bday:'Anya'},
    10: {note:'Gym 7pm'},
    14: {diary:'long day…'},
    17: {holiday:'Good Friday'},
    22: {note:'Earth Day'},
    26: {today:true, diary:'sunday plans'},
    29: {bday:'Dad'},
  };
  return cells.map((c,i) => {
    if(c.om) return c;
    const dow = i % 7; // 0 = Sun, 6 = Sat
    return {...c, ...deco[c.d], we: (dow===0||dow===6)};
  });
}

      <div className="grid">
        <div className="day-headers">
          {DAY_HDRS.map((d,i) => (
            <div key={d} className={"day-hdr" + (i===0||i===6 ? " wk" : "")}>{d}</div>
          ))}
        </div>
        <div className="cells">
          {SAMPLE.map((c, i) => {
            const lastRow = i >= 28;
            const cls = ["cell"];
            if (c.om) cls.push("om");
            if (c.we && !c.om) cls.push("we");
            if (c.holiday) cls.push("holiday");
            if (lastRow) cls.push("lr");
            return (
              <div key={i} className={cls.join(" ")}>
                <div className="dnum">{c.d}</div>
                {c.today && <div className="today-dot" style={{background:theme.palette.accent, boxShadow:`0 0 6px ${theme.palette.accent}`}} />}
                {c.bday && <div className="bday">🎂</div>}
                {c.goal && <div className="goal-ring" />}
                {c.holiday && <div className="holiday-tag">{c.holiday}</div>}
                {!c.holiday && c.note && <div className="note-tag">★ {c.note}</div>}
                {!c.holiday && !c.note && c.diary && <div className="diary-tag">✎ {c.diary}</div>}
              </div>
            );
          })}
        </div>
      </div>

      <div className="footer">
        <div className="swatches">
          <div className="sw"><span className="dot" style={{background:theme.palette.accent}} />Accent</div>
          <div className="sw"><span className="dot" style={{background:theme.palette.goal}} />Goal</div>
          <div className="sw"><span className="dot" style={{background:theme.palette.note}} />Note</div>
          <div className="sw"><span className="dot" style={{background:theme.palette.diary}} />Diary</div>
          <div className="sw"><span className="dot" style={{background:theme.palette.wknd}} />Weekend</div>
          <div className="sw" style={{fontStyle:'italic'}}>{theme.hFont} · {theme.bFont}</div>
        </div>
      </div>
    </div>
  );
}

  return (

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
